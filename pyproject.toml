[project]
name = "hrrr-wind"
version = "1.2.0"
description = "HRRR wind climatology for sailing venues: extraction, validation against NDBC buoys, and venue comparison"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pandas",
    "matplotlib",
    "fastapi",
    "uvicorn",
]

[project.optional-dependencies]
# Needed only to download new HRRR data (not to view or analyze cached studies)
download = ["herbie-data", "xarray", "cfgrib"]
# Needed only to build the PowerPoint slide (studies/*/build_slide.py)
slides = ["python-pptx"]
dev = ["pytest", "httpx"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"hrrr_wind.web" = ["static/**/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-m 'not golden'"
markers = ["golden: slow regression test that re-runs the GTYC/HYC study from cached data"]
